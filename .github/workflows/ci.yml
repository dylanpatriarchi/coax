name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: lint
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # esbuild (pulled in by vitest/tsx) needs its postinstall to run.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Attacks and oracles must be fully offline in CI — no network, no live model.
      - name: Test (offline)
        run: npm test
        env:
          COAX_OFFLINE: '1'

      - name: Build
        run: npm run build

  coverage:
    runs-on: ubuntu-latest
    name: coverage
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Thresholds live in vitest.config.ts; this step fails if they regress.
      - name: Test with coverage (offline)
        run: npm run test:coverage
        env:
          COAX_OFFLINE: '1'

      - name: Report coverage
        if: always()
        run: |
          {
            echo '## Coverage'
            echo
            echo '```'
            node --input-type=module -e "
              import { readFileSync } from 'node:fs';
              const t = JSON.parse(readFileSync('coverage/coverage-summary.json', 'utf8')).total;
              for (const k of ['statements', 'branches', 'functions', 'lines'])
                console.log(k.padEnd(12), t[k].pct + '%', '(' + t[k].covered + '/' + t[k].total + ')');
            "
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
